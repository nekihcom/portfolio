name: Deploy

on:
  push:
    branches:
      - main
  # Notion の記事更新はリポジトリへの push を伴わないため、定期的に再ビルドして反映する
  schedule:
    - cron: '0 21 * * *' # 毎日 06:00 JST
  # 記事を書いてすぐ反映したいときに Actions 画面から手動実行する
  workflow_dispatch:

# push と定期実行が重なったときに、古いビルドが後から上書きデプロイしないようにする
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: npm

      - run: npm ci

      - run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATA_SOURCE_ID: ${{ secrets.NOTION_DATA_SOURCE_ID }}
          # Secrets の設定漏れで記事 0 件のサイトを公開しないよう、未設定ならビルドを失敗させる
          NOTION_REQUIRED: 'true'
